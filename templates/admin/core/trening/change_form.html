{% extends "admin/change_form.html" %}

{% block extrahead %}
  {{ block.super }}
  <script>
    (function () {
      function wireDochazka(ctx){
        // Najdi inline skupinu "Docházka"
        var group = ctx.querySelector('#dochazka_set-group') ||
          Array.from(ctx.querySelectorAll('.inline-group')).find(function(g){
            var h2 = g.querySelector('h2');
            var t  = h2 ? (h2.textContent || '').toLowerCase() : '';
            return /doch[aá]zk/.test(t);
          });
        if (!group || group.classList.contains('x-wired')) return;

        group.classList.add('x-wired','x-dochazka-inline');
        if (!group.id) group.id = 'dochazka_set-group';

        // Schovej H2 (nadpis karty)
        var h2 = group.querySelector('h2');
        if (h2) h2.style.display = 'none';

        // Přejmenuj tlačítko na "Přidat Docházku"
        var add = group.querySelector('.add-row');
        if (add) {
          var a = add.querySelector('a');
          if (a) a.textContent = 'Přidat Docházku';
        }

        // Fallback – zruš problematické Django kolonky
        group.querySelectorAll('.inline_label, td.original, th.original')
             .forEach(function(n){ n.remove(); });
      }

      function boot(){ wireDochazka(document); }
      document.addEventListener('DOMContentLoaded', boot);
      window.addEventListener('load', boot);
      document.addEventListener('formset:added', boot);
      setTimeout(boot, 0); setTimeout(boot, 120);
    })();
  </script>
{% endblock %}

{% block extrastyle %}
  {{ block.super }}

  <style>
    :root{
      --label-w:160px; --field-w:360px; --row-gap:14px;
      --row-min: calc(var(--label-w) + var(--field-w) + 2*var(--row-gap));
    }
    /* obal modulu – šířka dle obsahu a horizontální scroll na malých */
    body.app-core.model-trening.change-form #content-main .module.aligned{
      width:max-content; min-width:var(--row-min); max-width:none;
      overflow-x:auto; -webkit-overflow-scrolling:touch;
      /* Přidáno: odsazení pro desktop, aby se řádky nedotýkaly okraje boxu */
      padding: 12px;
      box-sizing: border-box;
    }
    /* jeden řádek = karta */
    body.app-core.model-trening.change-form .module.aligned .form-row{
      display:grid !important; grid-template-columns:var(--label-w) var(--field-w) !important;
      align-items:center; gap:var(--row-gap); margin-bottom:12px;
      /* Odebráno odsazení, stín a linka - řeší rodič */
      padding:0; background:#fff; border-radius:10px; 
      width:max-content;
      box-sizing: border-box;
    }
    
    /* Poslední řádek by neměl mít mezeru dole */
    body.app-core.model-trening.change-form .module.aligned .form-row:last-child {
      margin-bottom: 0;
    }

    /* labely */
    body.app-core.model-trening.change-form .module.aligned .form-row > label{
      margin:0 !important; width:var(--label-w); font-weight:700; color:#111827; white-space:nowrap; text-align:left;
    }
    /* vstupy */
    body.app-core.model-trening.change-form .module.aligned .form-row input,
    body.app-core.model-trening.change-form .module.aligned .form-row select,
    body.app-core.model-trening.change-form .module.aligned .form-row textarea{
      width:var(--field-w) !important; max-width:var(--field-w) !important; min-width:var(--field-w) !important;
      box-sizing:border-box; height:36px; padding:6px 10px; border:1px solid #E5E7EB; border-radius:8px; font-size:14px; line-height:1.2;
      background:#fff;
    }
    body.app-core.model-trening.change-form .module.aligned .form-row textarea{ height:64px; resize:vertical; }
    body.app-core.model-trening.change-form .datetimeshortcuts{ white-space:nowrap; }
    
    /* @media (max-width:480px) byl odstraněn, řeší to nový @media (max-width: 767px) níže */
  </style>

  <style>
    :root{ --w-col:200px; --w-fixed:calc(var(--w-col) * 4); }

    /* obal inline skupiny */
    #dochazka_set-group, .x-dochazka-inline{
      background:#fff; border:0 !important; border-radius:12px; box-shadow:0 1px 2px rgba(16,24,40,.06);
      overflow:hidden; margin-top:12px;
    }
    /* tabulka */
    #dochazka_set-group table, .x-dochazka-inline table{
      width:100%; table-layout:fixed; border-collapse:separate; border-spacing:0; font-size:14px;
      background:#fff; /* jistota – žádné tmavé pozadí */
    }
    /* hlavička */
    #dochazka_set-group thead th, .x-dochazka-inline thead th{
      background:#FFF6CC; color:#111827; text-transform:uppercase; font-weight:800; font-size:12.5px; letter-spacing:.02em;
      padding:10px 12px; border-top:0; border-bottom:1px solid #F4E0A6; white-space:nowrap; text-align:center;
    }
    /* buňky těla */
    #dochazka_set-group tbody td, .x-dochazka-inline tbody td{
      padding:12px 12px; background:#fff; border-top:1px solid #E5E7EB; /* jemná linka */
      vertical-align:middle; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
      font-weight:700; text-align:center; position:relative;
    }

    /* šířky sloupců – poslední 4 pevné */
    #dochazka_set-group thead th:first-child, .x-dochazka-inline thead th:first-child{ text-align:left; }
    #dochazka_set-group tbody td:first-child, .x-dochazka-inline tbody td:first-child{ text-align:left; width:calc(100% - var(--w-fixed)) !important; }
    #dochazka_set-group thead th:nth-last-child(4),
    #dochazka_set-group thead th:nth-last-child(3),
    #dochazka_set-group thead th:nth-last-child(2),
    #dochazka_set-group thead th:nth-last-child(1),
    #dochazka_set-group tbody td:nth-last-child(4),
    #dochazka_set-group tbody td:nth-last-child(3),
    #dochazka_set-group tbody td:nth-last-child(2),
    #dochazka_set-group tbody td:nth-last-child(1){
      width:var(--w-col) !important; text-align:center;
    }

    /* skryj staré inline labely/original */
    #dochazka_set-group .inline_label, #dochazka_set-group .inline_label a,
    #dochazka_set-group td.original, #dochazka_set-group td.original a, #dochazka_set-group th.original{
      display:none !important; width:0 !important; padding:0 !important; border:0 !important; overflow:hidden !important;
    }

    /* první buňka – výběr hráče */
    #dochazka_set-group td:first-child .related-widget-wrapper{
      display:inline-flex; align-items:center; gap:8px; width:clamp(360px,55vw,720px) !important; max-width:100%;
    }
    #dochazka_set-group td:first-child .related-widget-wrapper select{
      width:100% !important; min-width:100% !important; max-width:none !important; height:34px; padding:6px 10px;
      border:1px solid #E5E7EB; border-radius:10px; background:#fff;
    }
    #dochazka_set-group td:first-child .related-widget-wrapper a{ display:inline-flex; align-items:center; justify-content:center; }

    /* poslední sloupec – akce doprostřed */
    #dochazka_set-group thead th:last-child, #dochazka_set-group tbody td:last-child{ text-align:center !important; vertical-align:middle !important; }
    #dochazka_set-group tbody td:last-child a,
    #dochazka_set-group tbody td:last-child .inline-deletelink,
    #dochazka_set-group tbody td:last-child .deletelink,
    #dochazka_set-group tbody td:last-child input[type="checkbox"]{
      display:inline-flex !important; align-items:center !important; justify-content:center !important; width:28px; height:28px; margin:0 auto;
    }

    /* === FIX „černé plochy“: řádek s tlačítkem add-row i případný tfoot === */
    #dochazka_set-group tr.add-row,
    .x-dochazka-inline tr.add-row{
      background:#fff !important;
    }
    #dochazka_set-group tr.add-row > td,
    .x-dochazka-inline tr.add-row > td{
      background:#fff !important;
      border-top:1px solid #E5E7EB !important; /* jemná horní linka */
      text-align:left !important;
      padding:12px !important;
    }
    #dochazka_set-group tr.add-row > td > a,
    .x-dochazka-inline tr.add-row > td > a,
    #dochazka_set-group .add-row a,
    #dochazka_set-group .add-row a:link,
    #dochazka_set-group .add-row a:visited{
      display:inline-block !important;
      width:auto !important; max-width:none !important; min-width:0 !important;
      white-space:nowrap !important;
      flex:0 0 auto !important; align-self:flex-start !important;

      /* vzhled tlačítka v tvém brandu */
      background:#E67817; border:3px solid #D1640C; color:#fff;
      padding:7px 12px; border-radius:999px; text-decoration:none;
      font-weight:800; letter-spacing:.2px;
    }
    #dochazka_set-group .add-row a:hover{ filter:brightness(1.05); }

    /* sjednocení případného tfoot (když by se někdy vykreslil) */
    #dochazka_set-group tfoot,
    .x-dochazka-inline tfoot{
      background:#fff !important;
      border-top:1px solid #E5E7EB !important;
    }
  </style>

  <style>
    /* Oprava barvy textu vybraného hráče v poli */
    .select2-container--admin-autocomplete .select2-selection--single .select2-selection__rendered {
      color: #111827 !important; /* Vynutí černou barvu textu */
    }

    /* Oprava pozadí a textu v samotném dropdownu */
    .select2-container .select2-dropdown {
      background: #fff !important;
      border: 1px solid #e5e7eb !important;
    }
    .select2-results__option {
      background: #fff !important;
      color: #111827 !important;
    }

    /* Zvýraznění položky při najetí myší (brand oranžová) */
    .select2-results__option--highlighted[aria-selected] {
      background: var(--brand) !important;
      color: #fff !important;
    }
  </style>

  <style>
    /*
     * 1. OPRAVA PRO DESKTOP (odstranění stínů)
     */
    body.app-core.model-trening.change-form .module.aligned .form-row {
        /* Odstranění stínů a linek, které vypadaly divně */
        box-shadow: none !important;
        border-bottom: none !important;
        /* Přidání malé mezery mezi řádky pro čistší vzhled */
        margin-bottom: 16px !important; 
    }

    /*
     * 2. OPRAVA PRO MOBILY (zarovnání)
     */
    @media (max-width: 767px) {
        
        /* Hlavní bílý box: plná šířka a vnitřní odsazení */
        body.app-core.model-trening.change-form #content-main .module.aligned {
            width: 100% !important;
            min-width: 0 !important;
            max-width: 100% !important;
            overflow-x: hidden !important;
            padding: 16px !important; /* Vnitřní odsazení */
            box-sizing: border-box !important;
        }

        /* Řádek formuláře: 1 sloupec (popisek a pole pod sebou) */
        body.app-core.model-trening.change-form .module.aligned .form-row {
            display: block !important;
            width: 100% !important;
            max-width: 100% !important;
            padding: 0 !important; /* Odsazení je na rodiči */
            margin-bottom: 16px !important; /* Mezera mezi položkami */
            box-sizing: border-box !important;
        }

        /* Popisek (label): plná šířka */
        body.app-core.model-trening.change-form .module.aligned .form-row > label {
            display: block !important;
            width: 100% !important;
            text-align: left !important;
            margin-bottom: 6px !important;
            white-space: normal !important;
        }

        /* Vstupní pole: plná šířka */
        body.app-core.model-trening.change-form .module.aligned .form-row input,
        body.app-core.model-trening.change-form .module.aligned .form-row select,
        body.app-core.model-trening.change-form .module.aligned .form-row textarea,
        body.app-core.model-trening.change-form .module.aligned .form-row .select2-container,
        body.app-core.model-trening.change-form .module.aligned .form-row .related-widget-wrapper {
            width: 100% !important;
            max-width: 100% !important;
            min-width: 0 !important;
            box-sizing: border-box !important;
        }
        
        /* Oprava pro widget data/času */
        body.app-core.model-trening.change-form .datetimeshortcuts {
            white-space: normal !important;
            margin-top: 8px;
        }
        .datetime-widget {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        /*
         * 3. Oprava tabulky "Docházka" (inline)
         */

        /* Obal tabulky: povolit horizontální rolování */
        #dochazka_set-group, .x-dochazka-inline {
            overflow-x: auto !important;
            -webkit-overflow-scrolling: touch !important;
        }
        #dochazka_set-group table, .x-dochazka-inline table {
            min-width: 600px !important;
        }
        #dochazka_set-group td:first-child .related-widget-wrapper {
            width: 100% !important;
            min-width: 250px;
        }
    }
  </style>
  {% endblock %}
