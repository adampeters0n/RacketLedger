{% extends "admin/change_form.html" %}

{% block extrahead %}
  {{ block.super }}
  <script>
    (function () {
      function wireDochazka(ctx){
        // Najdi inline skupinu "Docházka"
        var group = ctx.querySelector('#dochazka_set-group') ||
          Array.from(ctx.querySelectorAll('.inline-group')).find(function(g){
            var h2 = g.querySelector('h2');
            var t  = h2 ? (h2.textContent || '').toLowerCase() : '';
            return /doch[aá]zk/.test(t);
          });
        if (!group || group.classList.contains('x-wired')) return;

        group.classList.add('x-wired','x-dochazka-inline');
        if (!group.id) group.id = 'dochazka_set-group';

        // Schovej H2 (nadpis karty)
        var h2 = group.querySelector('h2');
        if (h2) h2.style.display = 'none';

        // Přejmenuj tlačítko na "Přidat Docházku"
        var add = group.querySelector('.add-row');
        if (add) {
          var a = add.querySelector('a');
          if (a) a.textContent = 'Přidat Docházku';
        }

        // Fallback – zruš problematické Django kolonky
        group.querySelectorAll('.inline_label, td.original, th.original')
             .forEach(function(n){ n.remove(); });
      }

      function boot(){ wireDochazka(document); }
      document.addEventListener('DOMContentLoaded', boot);
      window.addEventListener('load', boot);
      document.addEventListener('formset:added', boot);
      setTimeout(boot, 0); setTimeout(boot, 120);
    })();
  </script>
{% endblock %}

{% block extrastyle %}
  {{ block.super }}

  <style>
    :root{
      /* Ponecháme fixní šířku popisku z originálu */
      --label-w: 160px; 
      --row-gap: 14px;
    }

    /* Obal modulu – TOTO JE KLÍČOVÁ OPRAVA PRO "ODŘÍZNUTÍ" */
    body.app-core.model-trening.change-form #content-main .module.aligned{
      width: 95%;
      max-width: 580px; /* (160px label + ~360px pole + mezery) */
      min-width: 0;
      overflow-x: hidden;
      margin-left: auto;
      margin-right: auto;
      box-sizing: border-box;
      
      /* PŘIDÁNO: Zrušení defaultního mobilního paddingu z Django admina */
      padding: 0 !important; 
    }
    
    /* Jeden řádek = karta */
    body.app-core.model-trening.change-form .module.aligned .form-row{
      display: grid !important; 
      grid-template-columns: var(--label-w) 1fr !important; 
      align-items: center; 
      gap: var(--row-gap); 
      margin-bottom: 12px;
      padding: 8px 12px; 
      background: #fff; 
      border-radius: 10px; 
      box-shadow: 0 1px 2px rgba(0,0,0,.04);
      width: 100%;
      border-bottom: 1px solid #e5e7eb;
      box-sizing: border-box;
    }
    
    /* Labely (popisky) */
    body.app-core.model-trening.change-form .module.aligned .form-row > label{
      margin: 0 !important; 
      width: var(--label-w); 
      font-weight: 700; 
      color: #111827; 
      white-space: nowrap; 
      text-align: left;
      /* PŘIDÁNO: Zrušení defaultní mobilní mezery z Django admina */
      margin-bottom: 0 !important;
    }
    
    /* Vstupy (input, select, ...) */
    body.app-core.model-trening.change-form .module.aligned .form-row input,
    body.app-core.model-trening.change-form .module.aligned .form-row select,
    body.app-core.model-trening.change-form .module.aligned .form-row textarea,
    body.app-core.model-trening.change-form .module.aligned .form-row .select2-container,
    body.app-core.model-trening.change-form .module.aligned .form-row .related-widget-wrapper {
      width: 100% !important; 
      max-width: 100% !important; 
      min-width: 0 !important; /* Dovolí poli se zmenšit */
      box-sizing: border-box; 
      height: 36px; 
      padding: 6px 10px; 
      border: 1px solid #E5E7EB; 
      border-radius: 8px; 
      font-size: 14px; 
      line-height: 1.2;
      background: #fff;
    }
    
    body.app-core.model-trening.change-form .module.aligned .form-row textarea{ height: 64px; resize: vertical; }
    body.app-core.model-trening.change-form .datetimeshortcuts{ white-space:nowrap; flex-wrap: wrap; gap: 4px; }
  </style>
  <style>
    :root{ --w-col:200px; --w-fixed:calc(var(--w-col) * 4); }
    #dochazka_set-group, .x-dochazka-inline{ background:#fff; border:0 !important; border-radius:12px; box-shadow:0 1px 2px rgba(16,24,40,.06); overflow:hidden; margin-top:12px; }
    #dochazka_set-group table, .x-dochazka-inline table{ width:100%; table-layout:fixed; border-collapse:separate; border-spacing:0; font-size:14px; background:#fff; }
    #dochazka_set-group thead th, .x-dochazka-inline thead th{ background:#FFF6CC; color:#111827; text-transform:uppercase; font-weight:800; font-size:12.5px; letter-spacing:.02em; padding:10px 12px; border-top:0; border-bottom:1px solid #F4E0A6; white-space:nowrap; text-align:center; }
    #dochazka_set-group tbody td, .x-dochazka-inline tbody td{ padding:12px 12px; background:#fff; border-top:1px solid #E5E7EB; vertical-align:middle; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-weight:700; text-align:center; position:relative; }
    #dochazka_set-group thead th:first-child, .x-dochazka-inline thead th:first-child{ text-align:left; }
    #dochazka_set-group tbody td:first-child, .x-dochazka-inline tbody td:first-child{ text-align:left; width:calc(100% - var(--w-fixed)) !important; }
    #dochazka_set-group thead th:nth-last-child(4),
    #dochazka_set-group thead th:nth-last-child(3),
    #dochazka_set-group thead th:nth-last-child(2),
    #dochazka_set-group thead th:nth-last-child(1),
    #dochazka_set-group tbody td:nth-last-child(4),
    #dochazka_set-group tbody td:nth-last-child(3),
    #dochazka_set-group tbody td:nth-last-child(2),
    #dochazka_set-group tbody td:nth-last-child(1){ width:var(--w-col) !important; text-align:center; }
    #dochazka_set-group .inline_label, #dochazka_set-group .inline_label a,
    #dochazka_set-group td.original, #dochazka_set-group td.original a, #dochazka_set-group th.original{ display:none !important; width:0 !important; padding:0 !important; border:0 !important; overflow:hidden !important; }
    #dochazka_set-group td:first-child .related-widget-wrapper{ display:inline-flex; align-items:center; gap:8px; width:clamp(360px,55vw,720px) !important; max-width:100%; }
    #dochazka_set-group td:first-child .related-widget-wrapper select{ width:100% !important; min-width:100% !important; max-width:none !important; height:34px; padding:6px 10px; border:1px solid #E5E7EB; border-radius:10px; background:#fff; }
    #dochazka_set-group td:first-child .related-widget-wrapper a{ display:inline-flex; align-items:center; justify-content:center; }
    #dochazka_set-group thead th:last-child, #dochazka_set-group tbody td:last-child{ text-align:center !important; vertical-align:middle !important; }
    #dochazka_set-group tbody td:last-child a,
    #dochazka_set-group tbody td:last-child .inline-deletelink,
    #dochazka_set-group tbody td:last-child .deletelink,
    #dochazka_set-group tbody td:last-child input[type="checkbox"]{ display:inline-flex !important; align-items:center !important; justify-content:center !important; width:28px; height:28px; margin:0 auto; }
    #dochazka_set-group tr.add-row,
    .x-dochazka-inline tr.add-row{ background:#fff !important; }
    #dochazka_set-group tr.add-row > td,
    .x-dochazka-inline tr.add-row > td{ background:#fff !important; border-top:1px solid #E5E7EB !important; text-align:left !important; padding:12px !important; }
    #dochazka_set-group tr.add-row > td > a,
    .x-dochazka-inline tr.add-row > td > a,
    #dochazka_set-group .add-row a,
    #dochazka_set-group .add-row a:link,
    #dochazka_set-group .add-row a:visited{ display:inline-block !important; width:auto !important; max-width:none !important; min-width:0 !important; white-space:nowrap !important; flex:0 0 auto !important; align-self:flex-start !important; background:#E67817; border:3px solid #D1640C; color:#fff; padding:7px 12px; border-radius:999px; text-decoration:none; font-weight:800; letter-spacing:.2px; }
    #dochazka_set-group .add-row a:hover{ filter:brightness(1.05); }
    #dochazka_set-group tfoot,
    .x-dochazka-inline tfoot{ background:#fff !important; border-top:1px solid #E5E7EB !important; }
  </style>

  <style>
    .select2-container--admin-autocomplete .select2-selection--single .select2-selection__rendered { color: #111827 !important; }
    .select2-container .select2-dropdown { background: #fff !important; border: 1px solid #e5e7eb !important; }
    .select2-results__option { background: #fff !important; color: #111827 !important; }
    .select2-results__option--highlighted[aria-selected] { background: var(--brand) !important; color: #fff !important; }
  </style>

  <style>
    @media (max-width: 767px) {
        
        /*
         * ZMĚNA: Tato pravidla PŘEBIJÍ defaultní Django styly
         * a ZABRÁNÍ "zlomení" formuláře na mobilu.
         */
        
        /* 1. Vynucení dvou-sloupcového layoutu pro řádky */
        body.app-core.model-trening.change-form .module.aligned .form-row {
            display: grid !important; /* Vynutí grid */
            grid-template-columns: var(--label-w) 1fr !important; /* Vynutí 2 sloupce */
            padding: 8px 12px !important; /* Vrátí desktopový padding */
            margin-bottom: 12px !important;
            background: #fff !important; /* Vrátí bílé pozadí */
            box-shadow: 0 1px 2px rgba(0,0,0,.04) !important; /* Vrátí stín */
            border-bottom: 1px solid #e5e7eb !important; /* Vrátí linku */
        }

        /* 2. Vynucení vzhledu popisků */
        body.app-core.model-trening.change-form .module.aligned .form-row > label {
            width: var(--label-w) !important; /* Vynutí šířku popisku */
            margin-bottom: 0 !important; /* Zruší mobilní mezeru pod popiskem */
            white-space: nowrap !important; /* Ponechá na 1 řádku */
        }
        
        /* 3. Zrušení mobilního paddingu na kontejneru */
        body.app-core.model-trening.change-form #content-main .module.aligned {
            padding: 0 !important;
        }

        /*
         * TATO ČÁST ZŮSTÁVÁ:
         * 2. Oprava tabulky "Docházka" (inline)
         * To zajistí rolování tabulky na mobilu, což chceme.
         */

        /* Obal tabulky: povolit horizontální rolování */
        #dochazka_set-group, .x-dochazka-inline {
            overflow-x: auto !important;
            -webkit-overflow-scrolling: touch !important;
        }

        /* Tabulka: nastavit minimální šířku, aby se rolování aktivovalo */
        #dochazka_set-group table, .x-dochazka-inline table {
            min-width: 600px !important;
        }
        
        /* Oprava pro výběr hráče v tabulce na mobilu */
        #dochazka_set-group td:first-child .related-widget-wrapper {
            width: 100% !important;
            min-width: 250px;
        }
    }
  </style>
{% endblock %}
