{% extends "admin/change_list.html" %}

{% block extrahead %}
{{ block.super }}
<script>
document.addEventListener('DOMContentLoaded', function () {
  const table = document.getElementById('result_list');
  if (!table) return;

  const tbody = table.querySelector('tbody');
  const rows  = Array.from(tbody.querySelectorAll('tr'));
  const searchInput = document.getElementById('searchbar');

  // řádek "nic nenalezeno"
  let emptyRow = document.getElementById('players-no-results');
  if (!emptyRow) {
    emptyRow = document.createElement('tr');
    emptyRow.id = 'players-no-results';
    const td = document.createElement('td');
    td.colSpan = table.querySelectorAll('thead th').length || 3;
    td.style.textAlign = 'center';
    td.textContent = 'Nebyly nalezeny žádné výsledky.';
    emptyRow.appendChild(td);
    emptyRow.style.display = 'none';
    tbody.appendChild(emptyRow);
  }

  function norm(s){
    return (s||'').toString().toLowerCase()
      .normalize('NFD').replace(/[\u0300-\u036f]/g,''); // bez diakritiky
  }

  // >>> filtrujeme jen JMÉNO (ne e-mail)
  function haystack(tr){
    // obvykle <th class="field-jmeno"><a>…</a></th>
    const cell =
      tr.querySelector('th.field-jmeno') ||
      tr.querySelector('td.field-jmeno') ||
      tr.querySelector('th a, td a') ||
      tr.children[1]; // fallback (2. buňka po checkboxu)
    return norm(cell ? cell.innerText : '');
  }

  const cache = new WeakMap();
  function getHay(tr){ if(!cache.has(tr)) cache.set(tr, haystack(tr)); return cache.get(tr); }

  function applyFilter(q){
    const terms = norm(q).split(/\s+/).filter(Boolean);
    let visible = 0;

    rows.forEach(tr => {
      if (tr.id === 'players-no-results') return;
      const ok = terms.length === 0 || terms.every(t => getHay(tr).includes(t));
      tr.style.display = ok ? '' : 'none';
      if (ok) visible++;
    });

    emptyRow.style.display = (visible === 0) ? '' : 'none';
  }

  // počáteční hodnota z ?q= (fallback z URL pro jistotu)
  const initialQ = "{{ cl.query|default_if_none:''|escapejs }}" || new URLSearchParams(location.search).get('q') || '';
  applyFilter(initialQ);

  // živé filtrování při psaní
  if (searchInput){
    searchInput.addEventListener('input', () => applyFilter(searchInput.value || ''));
  }
});
</script>
{% endblock %}
