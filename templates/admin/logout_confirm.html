{% extends "admin/base_site.html" %}

{% block bodyclass %}{{ block.super }} logout-confirmation{% endblock %}

{% block breadcrumbs %}
<div class="breadcrumbs">
  <a href="{% url 'admin:index' %}">Domů</a>
  &rsaquo; Odhlášení
</div>
{% endblock %}

{% block content %}
<h1>Odhlášení</h1>
<p>Opravdu se chcete odhlásit ze systému Tenis systém Čimice?</p>
<form method="post">
  {% csrf_token %}
  <div class="delete-confirm-actions logout-confirm-actions">
    <input type="submit" value="Ano, odhlásit se" class="delete-confirm-submit">
    <a href="{{ cancel_url }}" class="button secondary">Zrušit</a>
  </div>
</form>
{% endblock %}
