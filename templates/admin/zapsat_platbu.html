{% extends "admin/base_site.html" %}
{% load i18n %}

{% block content %}
  <div class="content">
    <h1>Zapsat platbu</h1>

    <p>Platba bude zapsána těmto hráčům:</p>
    <ul style="margin:0 0 1rem 1.25rem;">
      {% for obj in queryset %}
        <li>{{ obj.jmeno }}</li>
      {% endfor %}
    </ul>

    <form method="post" novalidate>
      {% csrf_token %}

      <fieldset class="module aligned">
        <div class="form-row">
          <label for="id_amount"><strong>Částka (Kč)</strong></label>
          <input type="number" step="0.01" min="0.01" name="amount" id="id_amount" required class="vTextField">
        </div>

        <div class="form-row">
          <label for="id_description">Popis (volitelný)</label>
          <input type="text" name="description" id="id_description" placeholder="Např. bankovní převod" class="vTextField">
        </div>
      </fieldset>

      <!-- signál pro admin akci -->
      <input type="hidden" name="apply" value="1">

      <div class="submit-row">
        <input type="submit" class="default" value="Uložit platbu">
        <a href=".." class="button cancel-link">Zrušit</a>
      </div>
    </form>
  </div>
{% endblock %}
