{% load i18n %}
{# Jednotný page header – eyebrow + nadpis + krátká brand linka (+ volitelné object-tools) #}
<header class="ts-page-head{% if head_class %} {{ head_class }}{% endif %}" data-ts-page-head>
  <div class="ts-page-head__text">
    {% if eyebrow %}
    <p class="ts-page-head__eyebrow">{{ eyebrow }}</p>
    {% endif %}
    <h1 class="ts-page-head__title">{{ title }}</h1>
    <span class="ts-page-head__rule" aria-hidden="true"></span>
  </div>
  {% if tools %}{{ tools }}{% endif %}
</header>
