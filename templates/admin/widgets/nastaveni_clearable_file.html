<input type="{{ widget.type }}" name="{{ widget.name }}"{% include "django/forms/widgets/attrs.html" %}>
{% if widget.is_initial and not widget.required %}
<input type="checkbox" name="{{ widget.checkbox_name }}" id="{{ widget.checkbox_id }}" class="nast-file-clear-input"{% if widget.attrs.disabled %} disabled{% endif %}{% if widget.checked %} checked{% endif %}>
{% endif %}
