{% extends "web/base.html" %}
{% block title %}Přehled • Tenis systém{% endblock %}
{% block header %}Přehled{% endblock %}
{% block content %}
  <div class="grid md:grid-cols-3 gap-4">
    <div class="panel p-4">
      <div class="text-sm text-slate-400">Pohledávky</div>
      <div class="text-2xl font-semibold">{{ kpis.debt_sum }} Kč</div>
    </div>
    <div class="panel p-4">
      <div class="text-sm text-slate-400">Dnešní tréninky</div>
      <div class="text-2xl font-semibold">{{ kpis.todays_trainings }}</div>
    </div>
    <div class="panel p-4">
      <div class="text-sm text-slate-400">Poslední platby</div>
      <div class="text-2xl font-semibold">{{ kpis.last_payments }}</div>
    </div>
  </div>
{% endblock %}
