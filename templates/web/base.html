<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>{% block title %}Tenis systém{% endblock %}</title>

  <!-- Tailwind (na start stačí CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- HTMX (pro akce bez full reloadu) -->
  <script src="https://unpkg.com/htmx.org@1.9.10"></script>

  <style>
    :root{ --bg:#0b1220; --panel:#0f172a; --muted:#94a3b8; --text:#e5e7eb; --line:#334155; --accent:#2563eb;}
    body{ background:var(--bg); color:var(--text); }
    .panel{ background:var(--panel); border:1px solid var(--line); border-radius:14px; }
    .btn{ display:inline-block; padding:.5rem .8rem; border-radius:.6rem; }
    .btn-primary{ background:var(--accent); color:#fff; }
    .btn-ghost{ border:1px solid var(--line); }
  </style>
</head>
<body class="min-h-screen">
  <div class="flex">
    <!-- Sidebar -->
    <aside class="w-64 hidden md:block p-4 border-r border-slate-700">
      <div class="text-xl font-semibold mb-6">Tenis systém</div>
      <nav class="space-y-2 text-slate-300">
        <a href="{% url 'dashboard' %}" class="block py-2 px-3 rounded hover:bg-slate-800">Přehled</a>
        <a href="{% url 'payments_table' %}" class="block py-2 px-3 rounded hover:bg-slate-800">Platby</a>
        <a href="/admin/" class="block py-2 px-3 rounded hover:bg-slate-800">Admin</a>
      </nav>
    </aside>

    <!-- Content -->
    <main class="flex-1 p-4 md:p-8 space-y-6">
      <header class="flex items-center justify-between">
        <h1 class="text-2xl font-semibold">{% block header %}{% endblock %}</h1>
        <div class="space-x-2">
          <a href="{% url 'payments_table' %}" class="btn btn-ghost">Tabulka plateb</a>
          <a href="/admin/core/transakce/add/" class="btn btn-primary">Zadat platbu</a>
        </div>
      </header>

      {% block content %}{% endblock %}
    </main>
  </div>
</body>
</html>
