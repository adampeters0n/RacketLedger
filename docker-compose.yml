services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tenissystem
      POSTGRES_USER: tennis
      POSTGRES_PASSWORD: tennis
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tennis -d tenissystem"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      DJANGO_SECRET_KEY: docker-dev-change-me
      DEBUG: "True"
      DATABASE_URL: postgres://tennis:tennis@db:5432/tenissystem
      ALLOWED_HOSTS: localhost,127.0.0.1,web
      CSRF_TRUSTED_ORIGINS: http://localhost:8000,http://127.0.0.1:8000
      BOOTSTRAP_ADMIN_PASSWORD: admin123
      BOOTSTRAP_NAZEV: Demo tenisový klub
      BOOTSTRAP_EMAIL: info@example.com
      BOOTSTRAP_ADMIN_USER: admin
      BOOTSTRAP_ADMIN_EMAIL: admin@example.com
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
